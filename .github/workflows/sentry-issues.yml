# Files a GitHub issue for each new Sentry issue (deduplicated, with stack trace),
# and comments the latest event's JSON on it with personal data removed.
# Uses .github/scripts/sentry-issues.sh, vendored from
# https://github.com/caezium/sentry-to-github-issues and extended.
#
# Required repository secret (Settings → Secrets and variables → Actions → Secrets):
#   SENTRY_AUTH_TOKEN — read-only Sentry token (project:read, event:read, org:read)
#
# Required repository variables (Settings → Secrets and variables → Actions → Variables):
#   SENTRY_ORG        — Sentry organization slug
#   SENTRY_PROJECTS   — Sentry project slug(s), space-separated
#
# Runs every 30 minutes; also runnable from Actions → Sentry Issues → Run workflow.

name: Sentry Issues

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sentry-issues
  cancel-in-progress: false

jobs:
  file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Poll Sentry and file GitHub issues
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECTS: ${{ vars.SENTRY_PROJECTS }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          EVENT_JSON_DIR: sentry-events
        run: bash .github/scripts/sentry-issues.sh

      - name: Upload event JSON
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sentry-events
          path: sentry-events/
          if-no-files-found: ignore
          retention-days: 90
