# Create a versioned GitHub release with installers for macOS, Windows, and Linux.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   MODIO_API_KEY                 — game API key from mod.io
#   MODIO_GAME_ID                 — numeric game ID from mod.io
#   SENTRY_DSN                    — optional Sentry DSN for Rust and frontend error reporting
#   TAURI_SIGNING_PRIVATE_KEY     — minisign private key for updater artifacts
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — optional password for that key
#
# Run from Actions → Release → Run workflow.
#
# Inputs:
#   bump               — manual, patch, minor, or major (default: manual)
#   version            — base semver, e.g. 1.2.3 (required when bump=manual, otherwise empty)
#   prerelease_channel — none, alpha, beta, or rc (default: none)
#   prerelease_number  — iteration when a channel is set, e.g. 1 → 1.2.3-alpha.1
#
# patch/minor/major bump the latest stable tag (vX.Y.Z, prerelease tags ignored).
# With no stable tag, the base version in package.json is used instead.
#
# Examples (latest stable tag v1.2.3):
#   Stable:    bump=manual, version=1.2.4, channel=none        → v1.2.4
#   Patch:     bump=patch, channel=none                        → v1.2.4
#   Minor:     bump=minor, channel=none                        → v1.3.0
#   Major:     bump=major, channel=none                        → v2.0.0
#   Alpha:     bump=minor, channel=alpha, prerelease_number=1  → v1.3.0-alpha.1
#   Beta:      bump=minor, channel=beta, prerelease_number=2   → v1.3.0-beta.2
#   RC:        bump=manual, version=1.3.0, channel=rc, prerelease_number=1 → v1.3.0-rc.1
#
# This workflow commits the version bump to main, pushes a git tag, creates a GitHub
# release, builds Tauri bundles for all platforms, and uploads installers to the release.
# Linux releases are AppImage only. After all platform builds succeed, updater
# manifests are published to a rolling `updater` GitHub release.
# Prerelease channels mark the GitHub release as a prerelease. Re-running the same
# version/tag will fail if that tag already exists.
#
# Windows MSI installers use WiX, which only accepts numeric versions. The Windows
# build sets bundle.windows.wix.version from the app version (alpha/beta/rc channels
# are encoded into the fourth numeric component). Other platforms use the full semver.
#
# For ad-hoc CI builds without git commits, use the Build workflow instead.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (manual uses the version below)
        type: choice
        options:
          - manual
          - patch
          - minor
          - major
        default: manual
      version:
        description: Base version for manual bump (e.g. 1.2.3)
        type: string
        default: ""
      prerelease_channel:
        description: Prerelease channel
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc
        default: none
      prerelease_number:
        description: Prerelease number (e.g. 1 for 1.2.3-alpha.1)
        type: string
        default: "1"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: resolve
        env:
          BUMP: ${{ inputs.bump }}
          MANUAL_VERSION: ${{ inputs.version }}
          PRERELEASE_CHANNEL: ${{ inputs.prerelease_channel }}
          PRERELEASE_NUMBER: ${{ inputs.prerelease_number }}
        run: |
          set -euo pipefail

          MANUAL_VERSION="${MANUAL_VERSION//[[:space:]]/}"

          if [[ "$BUMP" == "manual" ]]; then
            if [[ ! "$MANUAL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must be major.minor.patch (e.g. 1.2.3) when bump is manual"
              exit 1
            fi
            BASE_VERSION="$MANUAL_VERSION"
          else
            if [[ -n "$MANUAL_VERSION" ]]; then
              echo "::error::Leave version empty when bump is ${BUMP}, or set bump to manual"
              exit 1
            fi

            latest_tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [[ -n "$latest_tag" ]]; then
              current="${latest_tag#v}"
              echo "Bumping from latest stable tag ${latest_tag}"
            else
              current="$(node -p 'require("./package.json").version')"
              current="${current%%-*}"
              echo "No stable tag found; bumping from package.json version ${current}"
            fi

            IFS=. read -r major minor patch <<< "$current"
            case "$BUMP" in
              major) BASE_VERSION="$((major + 1)).0.0" ;;
              minor) BASE_VERSION="${major}.$((minor + 1)).0" ;;
              patch) BASE_VERSION="${major}.${minor}.$((patch + 1))" ;;
              *)
                echo "::error::Unknown bump: ${BUMP}"
                exit 1
                ;;
            esac
          fi

          if [[ "$PRERELEASE_CHANNEL" == "none" ]]; then
            resolved="$BASE_VERSION"
          else
            if [[ ! "$PRERELEASE_NUMBER" =~ ^[0-9]+$ ]] || [[ "$PRERELEASE_NUMBER" == "0" ]]; then
              echo "::error::prerelease_number must be a positive integer"
              exit 1
            fi
            resolved="${BASE_VERSION}-${PRERELEASE_CHANNEL}.${PRERELEASE_NUMBER}"
          fi

          tag="v${resolved}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists locally"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists on origin"
            exit 1
          fi

          echo "version=$resolved" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $resolved (${tag})"

      - name: Set release version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: node .github/scripts/set-release-version.mjs

      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): bump version to ${{ steps.resolve.outputs.version }}"
          git push origin HEAD:main

      - name: Create and push tag
        run: |
          set -euo pipefail
          git tag "${{ steps.resolve.outputs.tag }}"
          git push origin "${{ steps.resolve.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
          PRERELEASE_CHANNEL: ${{ inputs.prerelease_channel }}
        run: |
          set -euo pipefail
          args=(
            gh release create "$TAG"
            --title "Modkist v${VERSION}"
            --generate-notes
          )
          if [[ "$PRERELEASE_CHANNEL" != "none" ]]; then
            args+=(--prerelease)
          fi
          "${args[@]}"

  build:
    name: ${{ matrix.platform }}
    needs: prepare_release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-universal
            tauri_args: --target universal-apple-darwin
          - os: windows-latest
            platform: windows
            tauri_args: --bundles msi
          - os: ubuntu-22.04
            platform: linux
            tauri_args: --bundles appimage

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare_release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Set release version
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
        run: node .github/scripts/set-release-version.mjs

      - name: Set MSI version
        if: matrix.platform == 'windows'
        env:
          VERSION: ${{ needs.prepare_release.outputs.version }}
        run: node .github/scripts/set-wix-version.mjs

      - name: Install pinned Rust
        uses: ./.github/actions/setup-rust

      - name: Install macOS universal targets
        if: matrix.platform == 'macos-universal'
        # Run in src-tauri so the targets go to the pinned toolchain.
        working-directory: src-tauri
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-release
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        env:
          MODIO_API_KEY: ${{ secrets.MODIO_API_KEY }}
          MODIO_GAME_ID: ${{ secrets.MODIO_GAME_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.tauri_args }}

      - name: Patch AppImage for host Wayland (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: bash .github/scripts/patch-appimage-wayland.sh

      - name: Re-sign patched AppImage
        if: matrix.os == 'ubuntu-22.04'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*_*_*.AppImage)
          if [[ ${#appimages[@]} -eq 0 ]]; then
            appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          fi
          if [[ ${#appimages[@]} -eq 0 ]]; then
            echo "::error::No AppImage found to re-sign"
            exit 1
          fi
          npm run tauri signer sign -- "${appimages[0]}"

      - name: Upload bundles to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare_release.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          files=()
          case "$PLATFORM" in
            macos-universal)
              while IFS= read -r -d '' file; do
                files+=("$file")
              done < <(find src-tauri/target -path '*/release/bundle/*' \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) -type f -print0)
              ;;
            windows)
              while IFS= read -r -d '' file; do
                files+=("$file")
              done < <(find src-tauri/target -path '*/release/bundle/*' \( -name '*.msi' -o -name '*.msi.sig' \) -type f -print0)
              ;;
            linux)
              while IFS= read -r -d '' file; do
                files+=("$file")
              done < <(find src-tauri/target -path '*/release/bundle/*' \( -name '*.AppImage' -o -name '*.AppImage.sig' \) -type f -print0)
              ;;
            *)
              echo "::error::Unknown platform: $PLATFORM"
              exit 1
              ;;
          esac
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No bundle files found"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

  publish_updater_manifest:
    name: updater-manifest
    needs: [prepare_release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare_release.outputs.tag }}

      - name: Publish updater manifests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare_release.outputs.version }}
          TAG: ${{ needs.prepare_release.outputs.tag }}
          PRERELEASE_CHANNEL: ${{ inputs.prerelease_channel }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/publish-updater-manifest.mjs
