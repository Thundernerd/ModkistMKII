# Checks every pull request to main, and every push to main.
#
# Runs the type check, the node:test suites for the release scripts under
# .github/scripts/, the Rust tests in src-tauri, and clippy on src-tauri with
# warnings as errors. Clippy runs on Linux, Windows and macOS, so code behind a
# platform cfg is linted too. Any failing step fails the run.
# This workflow does not build installers (see the Build workflow) and needs no secrets.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on a PR, but let every push to main finish so each
  # commit on main keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ci
          cache-on-failure: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        id: install
        run: npm ci

      # The four checks below run even if an earlier one fails, so one run reports
      # every failing check. They are skipped only when setup itself failed.
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Script tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:scripts

      - name: Rust tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: src-tauri
        run: cargo test --locked

      - name: Rust clippy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

  # Clippy only, on the platforms the checks job does not cover, so code behind
  # #[cfg(windows)] or #[cfg(target_os = "macos")] is linted too. Clippy does not
  # need the built frontend, so this job sets up no Node.
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: clippy
          cache-on-failure: true

      # Same gate as the checks job: skipped only when setup itself failed.
      - name: Rust clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
